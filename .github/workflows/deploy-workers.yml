name: Deploy to Cloudflare Workers

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - name: Build content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make content

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check format
        run: pnpm run fmt:check

      - name: Run knip
        run: pnpm run knip

      - name: Check types
        run: pnpm run types:check

      - name: Build Worker with OpenNext
        run: pnpm exec opennextjs-cloudflare build

      - name: Validate Worker bundle
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4'
          command: deploy --dry-run --outdir .wrangler/dry-run

      - name: Collect Worker build diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          count_files() {
            if [[ -d "$1" ]]; then
              find "$1" -type f | wc -l | tr -d ' '
            else
              echo 0
            fi
          }

          size_bytes() {
            if [[ -e "$1" ]]; then
              du -sb "$1" | cut -f1
            else
              echo 0
            fi
          }

          handler=.open-next/server-functions/default/handler.mjs
          traced_content=.open-next/server-functions/default/content
          report="$RUNNER_TEMP/open-next-diagnostics.md"

          handler_bytes=$(size_bytes "$handler")
          if [[ -f "$handler" ]]; then
            handler_gzip_bytes=$(gzip -c "$handler" | wc -c | tr -d ' ')
          else
            handler_gzip_bytes=0
          fi

          {
            echo "## OpenNext Worker diagnostics"
            echo
            echo '| Metric | Value |'
            echo '| --- | ---: |'
            echo "| Handler bytes | $handler_bytes |"
            echo "| Handler gzip bytes | $handler_gzip_bytes |"
            echo "| Source content files | $(count_files content) |"
            echo "| Source content bytes | $(size_bytes content) |"
            echo "| Traced content files | $(count_files "$traced_content") |"
            echo "| Traced content bytes | $(size_bytes "$traced_content") |"
          } > "$report"

          cat "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Worker build diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: workers-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/open-next-diagnostics.md
            .open-next/server-functions/default/handler.mjs.meta.json
            .wrangler/dry-run
          if-no-files-found: warn
          retention-days: 7

      - name: Deploy production Worker
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      - name: Upload preview Worker version
        if: github.ref != 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: versions upload
