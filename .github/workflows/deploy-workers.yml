name: Deploy to Cloudflare Workers

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - name: Build content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make content

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check format
        run: pnpm run fmt:check

      - name: Run knip
        run: pnpm run knip

      - name: Check types
        run: pnpm run types:check

      - name: Build Worker with OpenNext
        run: pnpm exec opennextjs-cloudflare build

      - name: Validate Worker bundle
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: 4.119.0
          command: deploy --dry-run --outdir .wrangler/dry-run

      - name: Deploy production Worker
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.119.0
          command: deploy

      - name: Upload preview Worker version
        if: github.ref != 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.119.0
          command: versions upload
