name: CI

permissions:
  contents: write
  packages: write

env:
  NEXT_TELEMETRY_DISABLED: 1
  IMAGE_NAME: ghcr.io/hoahrb/hoa-fuma

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  ci:
    concurrency:
      group: hoa-fuma-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Verify and package image retention script
        id: retention
        run: |
          python3 -m unittest discover -s scripts -p 'test_cleanup_images.py' -v
          echo "script=$(base64 -w0 scripts/cleanup-images.py)" >> "$GITHUB_OUTPUT"

      - name: Reuse published content and remove international plans
        run: |
          ./scripts/fetch-data.sh
          git fetch --no-tags --depth=1 origin aa0cf20f0d9730a2ea47a818f4e4188fd1eb982f
          git archive FETCH_HEAD content/docs content/blog content/news | tar -x
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          root = Path("content/docs").resolve()
          plans = ("2024/09333", "2023/35163", "2024/35163", "2025/35163")
          for plan in plans:
              target = (root / plan).resolve()
              assert target.is_relative_to(root) and target.is_dir(), plan
              count = sum(p.is_file() for p in target.rglob("*"))
              shutil.rmtree(target)
              print(f"Removed {plan}: {count} generated files")
          PY

      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.node-version'
          # cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check format
        run: pnpm run fmt:check

      - name: Run knip
        run: pnpm run knip

      - name: Check types
        run: pnpm run types:check

      - name: Test
        run: pnpm test

      - name: Package docs deployment probe
        id: docs-probe
        run: echo "script=$(base64 -w0 scripts/verify-docs-deployment.mjs)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          # build-args: |
          #   NEXT_PUBLIC_UMAMI_SRC=${{ vars.UMAMI_SRC }}
          #   NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Commit and push to production branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add -f content/
          git commit -m "docs: update course pages" || echo "No changes to commit"
          git fetch --no-tags --depth=1 origin production
          expected=$(git rev-parse FETCH_HEAD)
          git push origin HEAD:production --force-with-lease="refs/heads/production:$expected"

      # - name: Tailscale
      #   uses: tailscale/github-action@v4.1.3
      #   with:
      #     oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      #     oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
      #     tags: tag:ci

      - name: Deploy container on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ github.token }}
          FUMA_GITHUB_API_TOKEN: ${{ secrets.FUMA_GITHUB_API_TOKEN }}
          CLEANUP_SCRIPT_BASE64: ${{ steps.retention.outputs.script }}
          CLEANUP_APPLY: ${{ vars.FUMA_IMAGE_CLEANUP_APPLY }}
          DOCS_PROBE_BASE64: ${{ steps.docs-probe.outputs.script }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_TOKEN,FUMA_GITHUB_API_TOKEN,CLEANUP_SCRIPT_BASE64,CLEANUP_APPLY,DOCS_PROBE_BASE64
          script: |
            set -euo pipefail
            image_ref='${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}'
            retention_tag='${{ env.IMAGE_NAME }}:deploy-${{ github.run_id }}-${{ github.run_attempt }}'
            container='hoa-fuma'
            port='${{ secrets.VPS_APP_PORT }}'

            command -v python3 >/dev/null
            cleanup_script=$(mktemp)
            trap 'rm -f "$cleanup_script"' EXIT
            printf '%s' "$CLEANUP_SCRIPT_BASE64" | base64 --decode > "$cleanup_script"
            python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read())' "$cleanup_script"
            previous_image=''
            if docker container inspect "$container" >/dev/null 2>&1; then
              previous_image=$(docker container inspect --format '{{.Image}}' "$container")
              docker tag "$previous_image" '${{ env.IMAGE_NAME }}:rollback-${{ github.run_id }}-${{ github.run_attempt }}'
            fi
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker pull "${image_ref}"
            docker tag "$image_ref" "$retention_tag"
            rollback() {
              if [ -n "$previous_image" ]; then
                echo "Restoring previous image: $previous_image" >&2
                docker rm -f "$container" 2>/dev/null || true
                docker run -d --name "$container" --network proxy --restart unless-stopped -p "${port}:3000" -e GITHUB_TOKEN="${FUMA_GITHUB_API_TOKEN}" -e NODE_OPTIONS="--max-old-space-size=1638" "$previous_image"
              fi
            }
            docker rm -f "${container}" 2>/dev/null || true
            docker run -d --name "${container}" --network proxy --restart unless-stopped -p "${port}:3000" -e GITHUB_TOKEN="${FUMA_GITHUB_API_TOKEN}" -e NODE_OPTIONS="--max-old-space-size=1638" "${image_ref}"

            # Read the deployed build configuration so future basePath changes need no workflow edit.
            ready=false
            for attempt in $(seq 1 20); do
              if docker exec "$container" node -e '
                const { config } = require("./.next/required-server-files.json");
                const path = (config.basePath || "") + "/";
                const url = "http://127.0.0.1:3000" + path;
                fetch(url, { signal: AbortSignal.timeout(3000) })
                  .then(response => {
                    console.log("Readiness " + url + ": HTTP " + response.status);
                    process.exit(response.ok ? 0 : 1);
                  })
                  .catch(error => {
                    console.error("Readiness " + url + ": " + error.message);
                    process.exit(1);
                  });
              '; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              echo "Application readiness check failed; skipping image cleanup." >&2
              docker logs --tail 100 "$container" >&2
              rollback
              exit 1
            fi
            docker image inspect --format 'Deployed image bytes: {{.Size}}' "$image_ref"
            docker stats --no-stream "$container"
            # Sample throughout the probes; before/after snapshots miss cold-render peaks.
            stats_file=$(mktemp)
            (
              while docker container inspect "$container" >/dev/null 2>&1; do
                docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.CPUPerc}}' "$container"
                sleep 1
              done
            ) > "$stats_file" &
            stats_pid=$!
            if ! printf '%s' "$DOCS_PROBE_BASE64" | base64 --decode | docker exec -i "$container" node --input-type=module; then
              kill "$stats_pid" 2>/dev/null || true
              cat "$stats_file"
              rm -f "$stats_file"
              docker stats --no-stream "$container"
              docker logs --tail 100 "$container" >&2
              echo "Docs probes failed; skipping image cleanup. Previous image: $previous_image" >&2
              rollback
              exit 1
            fi
            kill "$stats_pid" 2>/dev/null || true
            cat "$stats_file"
            rm -f "$stats_file"
            docker stats --no-stream "$container"
            docker logs --tail 30 "$container"
            if [ "$CLEANUP_APPLY" = true ]; then
              python3 "$cleanup_script" --days 14 --keep 5 --protect-image "$previous_image" --apply
            else
              python3 "$cleanup_script" --days 14 --keep 5 --protect-image "$previous_image"
            fi
