name: CI

permissions:
  contents: write
  packages: write

env:
  NEXT_TELEMETRY_DISABLED: 1
  IMAGE_NAME: ghcr.io/hoahrb/hoa-fuma

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  ci:
    concurrency:
      group: hoa-fuma-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Verify and package image retention script
        id: retention
        run: |
          python3 -m unittest discover -s scripts -p 'test_cleanup_images.py' -v
          echo "script=$(base64 -w0 scripts/cleanup-images.py)" >> "$GITHUB_OUTPUT"

      - name: Build content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make content

      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.node-version'
          # cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check format
        run: pnpm run fmt:check

      - name: Run knip
        run: pnpm run knip

      - name: Check types
        run: pnpm run types:check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          # build-args: |
          #   NEXT_PUBLIC_UMAMI_SRC=${{ vars.UMAMI_SRC }}
          #   NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Commit and push to production branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add -f content/
          git commit -m "docs: update course pages" || echo "No changes to commit"
          git push origin HEAD:production --force

      # - name: Tailscale
      #   uses: tailscale/github-action@v4.1.3
      #   with:
      #     oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      #     oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
      #     tags: tag:ci

      - name: Deploy container on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ github.token }}
          FUMA_GITHUB_API_TOKEN: ${{ secrets.FUMA_GITHUB_API_TOKEN }}
          CLEANUP_SCRIPT_BASE64: ${{ steps.retention.outputs.script }}
          CLEANUP_APPLY: ${{ vars.FUMA_IMAGE_CLEANUP_APPLY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_TOKEN,FUMA_GITHUB_API_TOKEN,CLEANUP_SCRIPT_BASE64,CLEANUP_APPLY
          script: |
            set -euo pipefail
            image_ref='${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}'
            retention_tag='${{ env.IMAGE_NAME }}:deploy-${{ github.run_id }}-${{ github.run_attempt }}'
            container='hoa-fuma'
            port='${{ secrets.VPS_APP_PORT }}'

            command -v python3 >/dev/null
            cleanup_script=$(mktemp)
            trap 'rm -f "$cleanup_script"' EXIT
            printf '%s' "$CLEANUP_SCRIPT_BASE64" | base64 --decode > "$cleanup_script"
            python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read())' "$cleanup_script"
            previous_image=''
            if docker container inspect "$container" >/dev/null 2>&1; then
              previous_image=$(docker container inspect --format '{{.Image}}' "$container")
              docker tag "$previous_image" '${{ env.IMAGE_NAME }}:rollback-${{ github.run_id }}-${{ github.run_attempt }}'
            fi
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker pull "${image_ref}"
            docker tag "$image_ref" "$retention_tag"
            docker rm -f "${container}" 2>/dev/null || true
            docker run -d --name "${container}" --network proxy --restart unless-stopped -p "${port}:3000" -e GITHUB_TOKEN="${FUMA_GITHUB_API_TOKEN}" -e NODE_OPTIONS="--max-old-space-size=1638" "${image_ref}"

            # Skip cleanup if the new application cannot answer HTTP within 60 seconds.
            ready=false
            for attempt in $(seq 1 20); do
              if docker exec "$container" node -e 'fetch("http://127.0.0.1:3000/", {signal: AbortSignal.timeout(1000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true
            if [ "$CLEANUP_APPLY" = true ]; then
              python3 "$cleanup_script" --days 14 --keep 5 --protect-image "$previous_image" --apply
            else
              python3 "$cleanup_script" --days 14 --keep 5 --protect-image "$previous_image"
            fi
